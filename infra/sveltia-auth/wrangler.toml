name = "sveltia-auth"
main = "worker.js"
compatibility_date = "2026-06-01"

# Optional hardening: restrict which sites may authenticate through this relay.
# Uncomment after confirming login works. Include localhost if you use
# `astro dev` + the GitHub backend locally (the local-repository mode of
# Sveltia CMS does not need this relay at all).
# [vars]
# ALLOWED_DOMAINS = "www.outerreach.life,localhost:4321"

# Secrets are NOT stored here — set them with:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
